<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <title>talk talk talk</title>
</head>

<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong>Talk talk talk</strong></li>
      </ul>
      <ul>
        <li><a href="/room/general">general</a></li>
        <li><a href="/room/random">random</a></li>
        <li><a href="#" id="chat-message-reset" class="secondary">clear</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section id="chat-section" style="height: 60vh; overflow-y: auto; padding-right: 10px; margin-bottom: 1rem;">
    </section>

    <section>
      <p><small id="typing-indicator">&nbsp;</small></p>

      <form id="chat-form">
        <fieldset role="group">
          <input type="text" id="chat-message-input" name="message" placeholder="Type a message..." required
            autocomplete="off">
          <input type="submit" value="Send">
        </fieldset>
      </form>
    </section>
  </main>

  <script src="/public/main.js"></script>
</body>

</html>
